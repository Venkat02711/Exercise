name: Welcome New Contributors
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Comment
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome! Thank you so much for opening your first issue here. 🌟"
          pr-message: "Awesome! Thank you for submitting your first Pull Request. A maintainer will review it soon!🚀"
